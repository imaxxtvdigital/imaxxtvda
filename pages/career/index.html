<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAXX TV - Career Opportunities</title>
    <link rel="shortcut icon" href="/Assests/images/imaxx-icon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <!-- Link to external CSS file -->
    <style>
        #mbcbtns {
            z-index: 100;
            position: fixed;
            bottom: 20px;
            left: 20px;
        }

        .btn-back {
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #D1B261;
            color: #D1B261;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(209, 178, 97, 0.5);
        }

        .btn-back:hover {
            background-color: #D1B261;
            color: black;
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <h1>Career Form</h1>
    <div class="partner-form">
        <div id="success-message" style="display: none; background-color: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #c3e6cb;">
            <strong>Success!</strong> Your application has been submitted successfully. We will get back to you soon.
        </div>
        <form id="whatsappForm" onsubmit="sendToWhatsApp(event)" enctype="multipart/form-data"
            action="https://formsubmit.co/career.imaxxtv@gmail.com" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="address">Full Address:</label>
            <textarea id="address" name="address" rows="3" required></textarea>

            <label for="designation">Position Appliying For:</label>
            <select id="designation" name="designation" required>
                <option value="">Select a designation</option>
                <option value="Content QC Specialist/SNP">Content QC Specialist/SNP</option>
                <option value="Script Writing">Script Writing</option>
                <option value="Creative Head">Creative Head</option>
                <option value="Associate Creative">Associate Creative</option>
                <!-- <option value="Marketing Specialist">Creative Director</option> -->
                <option value="Content Head">Content Head</option>
                <option value="Back-End/Receptionist,Front Desk, Admin, HR">Back-End/Receptionist,Front Desk, Admin, HR</option>
                <option value="Technical Head">Technical Head</option>
                <option value="Graphic Designer">Graphic Designer</option>
                <option value="3D Illustration">3D Illustration</option>
                <option value="Video Editor">Video Editor</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" required></textarea>

            <label for="attachment">Resume (optional, PDF/DOC/DOCX/JPG/PNG):</label>
            <input type="file" id="attachment" name="attachment" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">

            <button type="submit">Send</button>
        </form>
    </div>

    <div id="mbcbtns">
        <button class="btn-back" onclick="goBacks()"
            style="display: flex !important; justify-content: center !important; align-items: center !important; background-color: rgba(0, 0, 0, 0.7) !important; border: 2px solid #D1B261 !important; color: #D1B261 !important; border-radius: 50% !important; width: 50px !important; height: 50px !important; visibility: visible !important; font-size: 24px !important;">
            <i class="fas fa-arrow-left"
                style="display: inline-block !important; color: #D1B261 !important; font-size: 20px !important; visibility: visible !important;"></i>
        </button>
    </div>

    <script>
        let lastScrollTop = 0;

        window.onscroll = function () {
            let button = document.getElementById("mbcbtns");
            let currentScrollTop = window.pageYOffset || document.documentElement.scrollTop;

            // Check if it's a mobile device (max-width: 768px)
            if (window.innerWidth <= 768) {
                if (currentScrollTop > lastScrollTop) {
                    // User is scrolling down
                    button.style.display = "block"; // Show the button
                } else {
                    // User is scrolling up
                    button.style.display = "none"; // Hide the button
                }
            } else {
                // On desktop, keep the button always visible
                button.style.display = "block"; // Ensure it's always shown on desktop
            }

            lastScrollTop = currentScrollTop <= 0 ? 0 : currentScrollTop; // For Mobile or negative scrolling
        };

        function goBacks() {
            window.history.back();
        }

        // Check if form was submitted successfully
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('submitted') === 'true') {
                document.getElementById("success-message").style.display = "block";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-storage.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVsSryjA8ZE78eJL5IXvQEn_QN3wwZnn4",
            authDomain: "imaxxtv-1a82f.firebaseapp.com",
            projectId: "imaxxtv-1a82f",
            storageBucket: "imaxxtv-1a82f.firebasestorage.app",
            messagingSenderId: "983969718785",
            appId: "1:983969718785:web:9d0d4e50b7dc12b34d4951",
            measurementId: "G-Y3CZM5TRXL"
        };

        let app;
        let db;
        let storage;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            storage = getStorage(app);
            console.log("Firebase initialized for career page");
        } catch (err) {
            console.error("Firebase init error (career):", err);
        }

        // Expose a helper on window to be used from non-module script
        window.saveApplicantToFirestore = async function saveApplicantToFirestore(applicantData) {
            if (!db) {
                console.error("Firestore not initialized; cannot save applicant");
                return;
            }
            try {
                const payload = {
                    ...applicantData,
                    submission_date: new Date().toISOString(),
                    timestamp: serverTimestamp()
                };
                const ref = await addDoc(collection(db, "applicants"), payload);
                console.log("Applicant saved with id:", ref.id);
            } catch (error) {
                console.error("Failed to save applicant:", error);
            }
        }

        // Uploads a file to Firebase Storage and returns a public download URL
        window.uploadResumeToFirebase = async function uploadResumeToFirebase(file) {
            if (!storage || !file) {
                return null;
            }
            try {
                const path = `resumes/${Date.now()}_${file.name}`;
                const ref = storageRef(storage, path);
                await uploadBytes(ref, file);
                const url = await getDownloadURL(ref);
                return url;
            } catch (e) {
                console.error("Resume upload failed:", e);
                return null;
            }
        }
    </script>

    <script>
        async function sendToWhatsApp(event) {
            event.preventDefault(); // Prevent default form submission
            
            const name = document.getElementById("name").value;
            const phone = document.getElementById("phone").value;
            const email = document.getElementById("email").value;
            const address = document.getElementById("address").value;
            const designation = document.getElementById("designation").value;
            const message = document.getElementById("message").value;
            const resumeFile = document.getElementById("attachment").files[0];

            // Show loading state
            const submitBtn = document.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = "Submitting...";
            submitBtn.disabled = true;

            try {
                // Save to Firestore first (without file upload for now)
                if (window.saveApplicantToFirestore) {
                    await window.saveApplicantToFirestore({
                        name: name,
                        contact: phone,
                        email: email,
                        address: address,
                        designation: designation,
                        message: message,
                        has_resume: resumeFile ? true : false,
                        resume_filename: resumeFile ? resumeFile.name : null,
                        reason: "career_application"
                    });
                }

                // Create FormData for FormSubmit
                const formData = new FormData();
                formData.append('name', name);
                formData.append('phone', phone);
                formData.append('email', email);
                formData.append('address', address);
                formData.append('designation', designation);
                formData.append('message', message);
                
                // Add resume file if exists
                if (resumeFile) {
                    formData.append('attachment', resumeFile);
                }
                
                // Add FormSubmit configuration
                formData.append('_subject', `Application for ${designation} - ${name}`);
                formData.append('_captcha', 'false');
                formData.append('_next', window.location.href + '?submitted=true');

                // Submit to FormSubmit
                console.log('Submitting to FormSubmit...');
                const response = await fetch('https://formsubmit.co/career.imaxxtv@gmail.com', {
                    method: 'POST',
                    body: formData
                });

                console.log('FormSubmit response:', response.status, response.statusText);
                
                if (response.ok) {
                    // Show success message
                    document.getElementById("success-message").style.display = "block";
                    document.getElementById("whatsappForm").reset();
                    // Scroll to top to show success message
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    console.log('Form submitted successfully!');
                } else {
                    console.error('FormSubmit failed:', response.status, response.statusText);
                    throw new Error(`Form submission failed: ${response.status} ${response.statusText}`);
                }

            } catch (error) {
                console.error('Submission error:', error);
                alert('There was an error submitting your application. Please try again or contact us directly.');
            } finally {
                // Reset button state
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
