<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAXX TV - Reality Show Contest</title>
    <link rel="shortcut icon" href="/Assests/images/imaxx-icon.png" type="image/x-icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reality_show.css">
    <style>
        #mbcbtns {
            z-index: 999;
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: block !important;
        }

        .btn-back {
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #D1B261;
            color: #D1B261;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(209, 178, 97, 0.5);
        }

        .btn-back:hover {
            background-color: #D1B261;
            color: black;
            transform: scale(1.1);
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .content-div {
            background-color: black;
            color: white;
            flex: 1;
            /* Takes all remaining space */
            display: flex;
            flex-direction: column;
            justify-content: top;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            margin-top: 150px;
        }

        .title {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .description {
            font-size: 1.2em;
            max-width: 600px;
            line-height: 1.5;


        }
    </style>
</head>

<body>

    <div class="main-container">

        <div class="content-wrapper">
            <div class="section-title"></div>
            <div class="card-container">
                <!-- Card 1: Laughter Akhada -->
                <div class="event-card">
                    <img src="/Assests/images/main lla.jpeg" alt="Laughter Akhada" class="event-image">
                    <div class="card-info">
                        <div class="card-title">Stand Up Comedy</div>
                        <div class="card-summary">LAUGHTER AKHADA : India's First Stand Up Comedian Hunt On Digital Platform</div>
                        <div class="card-actions">
                            <button class="btn-info" onclick="openDetail('Laughter Akhada', '•Laughter Akhada is a desi style comedic showdown where aspiring comedians from all over the country enter the Akhada (arena) to battle it out with humour, wit and crowd appeal. •This show is where comedians become warriors, jokes become weapons and laughter becomes the ultimate treasure. •Each episode transforms into a verbal combat one where comedians clash with punchlines, roast each other, challenge themes and aim to win the audience\'s heart and become the Laughter Akhada champion.', '/Assests/images/main lla.jpeg')">Info</button>
                            <button class="btn-watchs" onclick="openExternalPage()">Register Now</button>
                        </div>
                    </div>
                </div>

                <!-- Card 2: Candid Confessions -->
                <div class="event-card">
                    <img src="/Assests/series/talkshow.png" alt="Candid Confessions" class="event-image">
                    <div class="card-info">
                        <div class="card-title">Candid Confessions</div>
                        <div class="card-summary">Unfiltered celebrity conversations with twists, reveals and raw truths</div>
                        <div class="card-actions">
                            <button class="btn-info" onclick="openDetail('Candid Confessions', '•A free-flowing conversation that feels natural yet unpredictable, packed with playful activities and surprising reveals to keep viewers hooked. •Unlike conventional talk shows that skim the surface, Candid Confessions digs deeper into a celeb\'s personal world—guilty pleasures, never-admitted secrets and defining moments. •Every episode feels fresh, intimate and fun—where laughter, vulnerability and authenticity take center stage.', '/Assests/series/talkshow.png')">Info</button>
                        <button class="btn-watchs" onclick="openExternalPage()">Register Now</button>
                        </div>
                    </div>
                </div>

                <!-- Card 3: Home Chef -->
                <div class="event-card">
                    <img src="/Assests/series/home chef.png" alt="Home Chef" class="event-image">
                    <div class="card-info">
                        <div class="card-title">Home Chef</div>
                        <div class="card-summary">Celebrating real kitchens, real stories and unforgettable flavors</div>
                        <div class="card-actions">
                            <button class="btn-info" onclick="openDetail('Home Chef', '•Home Chef is an engaging culinary reality program that celebrates the art of cooking at home—where passion, creativity and culture meet. •Aspiring home cooks from diverse backgrounds showcase their signature flavors, personal stories and traditions, turning everyday ingredients into extraordinary dishes. •The show inspires audiences to explore healthy, affordable and creative cooking; promotes culinary diversity across regional, traditional and fusion cuisines; and builds a strong family connection with content that is relatable, wholesome and entertaining.', '/Assests/series/home chef.png')">Info</button>
                            <button class="btn-watchs" onclick="openExternalPage()">Register Now</button>
                        </div>
                    </div>
                </div>
                <!-- Event/BLOG Card 1 -->
                <!-- <div class="event-card"
                    onclick="openDetail('Home Chef', 'This is a detailed description of Event 1. Learn about the event details, speakers, timings, etc.', '/Assests/images/Design 2.png')">
                    <img src="/Assests/images/Design 2.png" alt="Event 1" class="event-image">
                    <div class="card-info">
                        <div class="card-title">Home Chef</div>
                        <div class="card-summary">Cooking Show</div>
                        <button class="btn-watchs" onclick="openExternalPage()">Register Now</button>
                    </div>
                </div> -->
                <!-- Event/BLOG Card 1 -->
                <!-- <div class="event-card"
                    onclick="openDetail('Event 1', 'This is a detailed description of Event 1. Learn about the event details, speakers, timings, etc.', '/Assests/photo_2025-02-17 19.00.37.jpeg')">
                    <img src="/Assests/photo_2025-02-17 19.00.37.jpeg" alt="Event 1" class="event-image">
                    <div class="card-info">
                        <div class="card-title">Event 1</div>
                        <div class="card-summary">Short description of Event 1.</div>
                        <button onclick="openNewPage()">Participate Now</button>
                    </div>
                </div> -->


                <!-- Add more event/blog cards as needed -->
            </div>
        </div>
    </div>

    <!-- Popup Modal -->
    <div id="popup-modal" class="popup-modal">
        <div class="popup-content">
            <div class="popup-body">
                <div class="popup-left">
                    <img id="popup-image" src="" alt="Event Image" class="popup-image" onclick="openExternalPage()">
                </div>
                <div class="popup-right">
            <h2 id="popup-title"></h2>
                    <div id="popup-description" class="popup-desc"></div>
                    <button class="close-btn" onclick="closePopup()">BACK</button>
                </div>
            </div>
        </div>

    </div>
    <div id="mbcbtns">
        <button class="btn-back" onclick="goBacks()">
            <i class="fas fa-arrow-left"></i>
        </button>
    </div>
    <script>
        function goBacks() {
            window.history.back();
        }

        // Ensure button is always visible, no matter what
        document.addEventListener('DOMContentLoaded', function () {
            const button = document.getElementById("mbcbtns");
            if (button) {
                button.style.display = "block";
            }
        });
    </script>
    <script src="reality_show.js"></script>
</body>

</html>
